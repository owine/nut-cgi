---
name: Lint

"on":
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - ".github/renovate.json"
  # Run on every PR (no paths-ignore): the branch ruleset requires the four
  # lint jobs to pass, so a docs-only PR that skips the workflow would leave
  # them expected-but-missing and permanently block merge. Linting is fast
  # (~10-30s) so the cost of running on every PR is trivial.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: Dockerfile Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Run hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Run shellcheck on shell scripts
        run: shellcheck healthcheck.sh entrypoint.sh

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Run yamllint on workflows
        run: yamllint .github/workflows/

  action-lint:
    name: GitHub Actions Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          fail-on-error: true
