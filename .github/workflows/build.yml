---
name: Build, Test, and Publish

"on":
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - "LICENSE"
      - ".github/renovate.json"
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "version.txt"
  # Run on every PR (no paths-ignore): the branch ruleset requires `ci-pass`
  # to report, and a workflow-level paths-ignore skips the whole run so the
  # aggregator never reports — leaving the PR permanently BLOCKED. Filtering
  # now lives in the `changes` job below, which gates the heavy `build` job;
  # docs-only PRs let `build` skip and `ci-pass` still passes.
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force-rebuild:
        description: 'Force rebuild without cache'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Detect whether the change set touches image-affecting files. Used to
  # gate the heavy multi-arch `build` job on PRs so docs/spec/release-please
  # only PRs skip the build entirely while `ci-pass` still passes. On push
  # to main (and tags) the workflow always builds — see the `build` if: —
  # so we skip this job entirely on non-PR events to avoid a wasted
  # checkout/paths-filter and to prevent a transient `changes` failure
  # from blocking push/tag image builds.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          # `every`: a changed file matches a filter only if it satisfies ALL
          # rules. Without this, dorny's default OR semantics make the leading
          # `**` match everything, so the `!`-exclusions are no-ops and the
          # filter is always true. With `every`, a file must match `**` AND
          # none of the `!` excludes.
          predicate-quantifier: 'every'
          filters: |
            image:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.github/renovate.json'
              - '!.release-please-manifest.json'
              - '!release-please-config.json'
              - '!version.txt'

  build:
    name: Build Multi-Arch Image
    # `needs: changes` is safe even on push/tag because `changes` is gated
    # PR-only above — it skips on push, and a skipped need still satisfies
    # the dependency. The if: short-circuits to true on non-PR events so
    # the empty `changes.outputs.image` isn't consulted there.
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-sha-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA tag
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Build with SHA tag only - promote later after testing
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          no-cache: ${{ github.event.inputs.force-rebuild == 'true' }}

      - name: Image built
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image built and tagged: $IMAGE_TAGS"
          echo "Image digest: $IMAGE_DIGEST"

  test:
    name: Functional Testing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-sha-tag }}
        run: |
          echo "Pulling image: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"
          # Tag locally for testing
          docker tag "$IMAGE_TAG" nut-cgi:test

      - name: Create test hosts.conf
        run: |
          cat > hosts.conf << 'EOF'
          # Test configuration - no actual UPS required
          MONITOR testups@localhost "Test UPS System"
          EOF

      - name: Run container
        run: |
          docker run -d \
            --name nut-cgi-test \
            -p 8080:80 \
            -v "$(pwd)/hosts.conf:/etc/nut/hosts.conf:ro" \
            nut-cgi:test

      - name: Wait for container startup
        run: |
          echo "Waiting for container to be healthy..."
          timeout 30 sh -c "
            until [ \"\$(docker inspect -f {{.State.Health.Status}} nut-cgi-test)\" = \"healthy\" ]; do
              echo \"Container status: \$(docker inspect -f {{.State.Health.Status}} nut-cgi-test)\"
              sleep 2
            done
          "

      - name: Verify container health
        run: |
          status=$(docker inspect -f '{{.State.Health.Status}}' nut-cgi-test)
          echo "Container health status: $status"
          if [ "$status" != "healthy" ]; then
            echo "ERROR: Container is not healthy"
            docker logs nut-cgi-test
            exit 1
          fi

      - name: Test web server response
        run: |
          echo "Testing web server on port 8080..."
          curl -v --fail --max-time 10 http://localhost:8080/upsstats.cgi

      - name: Test HTTP headers
        run: |
          echo "Verifying HTTP headers..."
          headers=$(curl -sI http://localhost:8080/upsstats.cgi)
          echo "$headers"
          if ! echo "$headers" | grep -qi "Content-Type"; then
            echo "ERROR: Missing Content-Type header"
            exit 1
          fi
          if ! echo "$headers" | grep -qi "X-Content-Type-Options: nosniff"; then
            echo "ERROR: Missing X-Content-Type-Options header"
            exit 1
          fi
          if ! echo "$headers" | grep -qi "X-Frame-Options: DENY"; then
            echo "ERROR: Missing X-Frame-Options header"
            exit 1
          fi
          echo "HTTP headers validated successfully"

      - name: Test upsset.cgi is blocked by default
        run: |
          echo "Verifying upsset.cgi is blocked..."
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/upsset.cgi)
          if [ "$status" != "403" ]; then
            echo "ERROR: upsset.cgi should return 403, got $status"
            exit 1
          fi
          echo "upsset.cgi correctly blocked (HTTP 403)"

      - name: Test CGI execution
        run: |
          echo "Testing CGI execution..."
          response=$(curl -s http://localhost:8080/upsstats.cgi)
          # Should have HTML content even without actual UPS
          if [ -z "$response" ]; then
            echo "ERROR: Empty response from CGI"
            exit 1
          fi
          echo "Response length: ${#response} bytes"
          echo "CGI execution verified"

      - name: Test health check script directly
        run: |
          echo "Testing health check script execution..."
          docker exec nut-cgi-test /healthcheck.sh
          exitcode=$?
          if [ $exitcode -ne 0 ]; then
            echo "ERROR: Health check script failed"
            exit 1
          fi
          echo "Health check script passed"

      - name: Test strict health check mode (should pass with basic infrastructure)
        run: |
          echo "Testing strict health check mode..."
          # This will fail because no actual UPS is configured, which is expected
          docker exec -e HEALTHCHECK_MODE=strict nut-cgi-test /healthcheck.sh || true
          echo "Strict mode test completed (expected to fail without real UPS)"

      - name: Verify non-root execution
        run: |
          echo "Verifying container runs as non-root user..."
          userid=$(docker exec nut-cgi-test id -u)
          username=$(docker exec nut-cgi-test id -un)
          echo "Container runs as: UID=$userid, User=$username"
          if [ "$userid" = "0" ]; then
            echo "ERROR: Container is running as root"
            exit 1
          fi
          echo "Non-root execution verified (UID: $userid)"

      - name: Test read-only filesystem compatibility
        run: |
          echo "Testing with read-only filesystem..."
          docker rm -f nut-cgi-test
          docker run -d \
            --name nut-cgi-test \
            --read-only \
            --tmpfs /tmp \
            -p 8080:80 \
            -v "$(pwd)/hosts.conf:/etc/nut/hosts.conf:ro" \
            nut-cgi:test

          # Wait for startup
          sleep 10

          # Verify it works with read-only filesystem
          curl --fail --max-time 10 http://localhost:8080/upsstats.cgi
          echo "Read-only filesystem test passed"

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs nut-cgi-test
          echo "=== Container inspect ==="
          docker inspect nut-cgi-test

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nut-cgi-test || true
          rm -f hosts.conf

  scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-sha-tag }}
        run: |
          echo "Pulling image for scanning: $IMAGE_TAG"
          docker pull "$IMAGE_TAG"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image-sha-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy for human-readable output
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image-sha-tag }}
          format: 'table'
          severity: 'HIGH,CRITICAL'

  promote:
    name: Tag and Promote Image
    runs-on: ubuntu-24.04
    needs: [build, test, scan]
    if: |
      github.event_name != 'pull_request' &&
      needs.test.result == 'success' &&
      needs.scan.result == 'success'
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine promotion tags
        id: tags
        env:
          SOURCE_TAG: ${{ needs.build.outputs.image-sha-tag }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          IMAGE_FULL: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          TAGS=""

          # Add :main tag for pushes to main branch
          if [ "$GIT_REF" = "refs/heads/main" ]; then
            TAGS="$TAGS $IMAGE_FULL:main"
          fi

          # Add release tags for version tags
          if [[ "$GIT_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$GIT_REF_NAME"
            # Remove 'v' prefix
            VERSION_NO_V="${VERSION#v}"

            # Extract version components
            MAJOR=$(echo "$VERSION_NO_V" | cut -d. -f1)
            MINOR=$(echo "$VERSION_NO_V" | cut -d. -f2)

            # Add all version tags
            TAGS="$TAGS $IMAGE_FULL:latest"
            TAGS="$TAGS $IMAGE_FULL:$VERSION"
            TAGS="$TAGS $IMAGE_FULL:v$MAJOR.$MINOR"
            TAGS="$TAGS $IMAGE_FULL:v$MAJOR"
          fi

          echo "SOURCE_TAG=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "PROMOTION_TAGS=$TAGS" >> "$GITHUB_OUTPUT"

          echo "Will promote:"
          echo "  From: $SOURCE_TAG"
          echo "  To: $TAGS"

      - name: Promote image with additional tags
        if: steps.tags.outputs.PROMOTION_TAGS != ''
        env:
          SOURCE: ${{ steps.tags.outputs.SOURCE_TAG }}
          PROMOTION_TAGS: ${{ steps.tags.outputs.PROMOTION_TAGS }}
        run: |
          # Use docker buildx imagetools create to add tags (fast, no rebuild)
          for TAG in $PROMOTION_TAGS; do
            echo "Promoting $SOURCE -> $TAG"
            docker buildx imagetools create --tag "$TAG" "$SOURCE"
          done

      - name: Promotion complete
        env:
          SHA_TAG: ${{ needs.build.outputs.image-sha-tag }}
          PROMOTION_TAGS: ${{ steps.tags.outputs.PROMOTION_TAGS }}
        run: |
          echo "Image promotion successful"
          echo "SHA tag: $SHA_TAG"
          if [ -n "$PROMOTION_TAGS" ]; then
            echo "Promoted to: $PROMOTION_TAGS"
          else
            echo "No additional tags applied"
          fi

  # Stable-named aggregator so the branch ruleset can require a single
  # `ci-pass` check regardless of how the underlying matrix/conditional
  # jobs evolve. Treats SKIPPED as success: docs-only PRs intentionally
  # skip `build` (and therefore `test`/`scan`/`promote`) via `changes`,
  # and the aggregator must not block those merges. Mirrors the pattern
  # used in owine/house-manager#191 and owine/trip-tracker ci.yml.
  ci-pass:
    needs: [changes, build, test, scan, promote]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed or were appropriately skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Log only the per-job `result` field, never the full `needs` blob.
          # `outputs` declared by upstream jobs can carry sensitive values
          # (image digests, tokens) so restricting the dump to results keeps
          # the diagnostic ("which job failed?") without the leak risk.
          echo "$NEEDS_JSON" | jq 'map_values({result})'
          # Whitelist acceptable results so future result types ('neutral',
          # 'action_required', etc.) fail closed instead of silently passing.
          if echo "$NEEDS_JSON" | jq -e 'any(.[].result; . != "success" and . != "skipped")' >/dev/null; then
            echo "::error::One or more required jobs did not succeed or skip."
            exit 1
          fi
